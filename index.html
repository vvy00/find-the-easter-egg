<!DOCTYPE html>
<html>
<head>
  <title>Find the Easter Egg</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<audio id="bg-music" src="audio/background.mp3" autoplay loop></audio>

<div id="ui">
  <div>⏱️ Time: <span id="time">0</span>s</div>
  <div>Level: <span id="level">1</span></div>
</div>

<h1 id="title">
  <img src="images/easter-egg.png" 
       alt="Easter Egg" 
       style="width:40px; height:40px; vertical-align:middle; margin-right:10px; position: relative; top: -4px;">
  Find the Easter Egg
</h1>

<div id="flashlight"></div>

<div id="grass"></div>

<div id="winScreen">
  <div>🏆 You Win!</div>
  <button onclick="restartGame()">Play Again</button>
</div>

<script src="script.js"></script>
</body>
</html>
