<!DOCTYPE html>
<html>
<head>
  <title>Find the Easter Egg</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial;
      background-color: #fdf6e3;
      background-image: radial-gradient(#ffd6e0 10%, transparent 11%),
                        radial-gradient(#bae1ff 10%, transparent 11%),
                        radial-gradient(#caffbf 10%, transparent 11%);
      background-size: 60px 60px;
    }
    #ui {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0,0,0,0.6);
      color: white;
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      box-sizing: border-box;
      font-size: 18px;
    }
    #title {
      text-align: center;
      position: fixed;
      top: 50px;
      width: 100%;
      color: #333;
      text-shadow: 1px 1px 4px black;
      text-shadow:
      0 0 5px #fff,
      0 0 10px #ffb3c6,
      0 0 20px #bde0fe;
    }
    .object {
      position: absolute;
      font-size: 70px;
      cursor: pointer;
    }
    .hiddenEgg {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 30px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .object:hover .hiddenEgg {
      opacity: 1;
      pointer-events: auto;
    }

  </style>
</head>
<body>

<div id="ui">
  <div>⏱️ Time: <span id="time">0</span>s</div>
  <div>Level: <span id="level">1</span></div>
</div>

<h1 id="title">Find the Hidden Easter Egg</h1>

<div class="object" style="top:200px; left:200px;">
  🪑
  <div class="hiddenEgg">🥚</div>
</div>

<div class="object" style="top:400px; left:500px;">🪵</div>
<div class="object" style="top:300px; left:800px;">🪑</div>
<div class="object" style="top:500px; left:900px;">🌳</div>

<script>
  const timeDisplay = document.getElementById("time");
  const levelDisplay = document.getElementById("level");

  let startTime = Date.now();
  let level = 1;

  let realEgg = document.querySelector(".hiddenEgg");

  setInterval(() => {
    let t = ((Date.now() - startTime) / 1000).toFixed(1);
    timeDisplay.textContent = t;
  }, 100);

  function setupEgg() {
    realEgg.onclick = () => {
      let time = ((Date.now() - startTime) / 1000).toFixed(2);
      alert("🎉 You found it in " + time + " seconds!");

      level++;
      levelDisplay.textContent = level;
      startTime = Date.now();

      moveEgg();
    };
  }

  function moveEgg() {
    const objects = document.querySelectorAll(".object");

    realEgg.remove();
    let randomObj = objects[Math.floor(Math.random() * objects.length)];
    let newEgg = document.createElement("div");
    newEgg.className = "hiddenEgg";
    newEgg.textContent = "🥚";

    randomObj.appendChild(newEgg);
    realEgg = newEgg;

    setupEgg();
  }

  setupEgg();
</script>

</body>
</html>
